# WebSocket upgrade for the real-time hub (/api/hubs/*, spec 005); plain requests keep "close".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Access log without query strings: browsers send the hub's access token as ?access_token=…
# (spec 005 research R2), and tokens must never reach logs (NFR-002).
log_format devsync_no_query '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                            '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    access_log /var/log/nginx/access.log devsync_no_query;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API and health endpoints (no CORS needed). Custom headers such as
    # Authorization, X-DevSync-Client and X-Correlation-ID, and cookies, are forwarded unchanged.
    # Host keeps its port so the API's Origin check (CSRF defence) sees the browser's real origin.
    location /api/ {
        # The API enforces the 1 MiB file-content limit itself (spec 003 FR-016). nginx's default of
        # 1 MiB would refuse a file at exactly the limit with an HTML 413 before the API sees it.
        client_max_body_size 2m;
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SignalR (spec 005): WebSockets need HTTP/1.1 and the upgrade headers; long-lived
        # connections send keep-alives every 15 s, so 120 s of silence means the peer is gone.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    location /health/ {
        proxy_pass http://api:8080;
    }

    # Single-page app: unknown paths serve index.html and the client router decides.
    location / {
        try_files $uri /index.html;
    }
}
