name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, unit + integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build (warnings are errors)
        run: dotnet build src/backend/DevSync.sln -c Release

      # Integration tests start PostgreSQL 18 through Testcontainers (Docker is available on ubuntu-latest).
      - name: Test
        run: dotnet test --solution src/backend/DevSync.sln -c Release --no-build

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      # postinstall links tests/frontend/node_modules to this package's node_modules.
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Monaco must stay in a lazy chunk and never load from a CDN (spec 003 research R8).
      - run: npm run check:bundle

  containers:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build images
        run: |
          cp .env.example .env
          docker compose build
