openapi: 3.1.0
info:
  title: DevSync API — Project Files and Code Editor
  version: 0.3.0
  description: >
    Contract for feature 003. Additive to the 002 contract
    (specs/002-identity-and-permissions/contracts/openapi.yaml): every 002 path, schema and error
    code is unchanged and not repeated here. New: the workspace file tree, item create, rename,
    move and delete, and file content read and save with revision preconditions.
    Every path below is guarded by the 002 RequireWorkspace filter: anonymous → 401; malformed
    workspace id, missing workspace or non-member → 404 not_found; member whose role lacks the
    operation → 403 forbidden. The role is read per request.
    Items are addressed only by id within the route's workspace; requests never carry paths.
    Every response carries X-Correlation-ID; errors are RFC 9457 Problem Details.
servers:
  - url: /

security:
  - bearer: []

paths:
  /api/workspaces/{workspaceId}/tree:
    get:
      summary: The whole folder and file tree of the workspace (no content)
      description: 'Operation: Read (Owner, Editor, Viewer). Unsorted; the client sorts folders first, then by name ignoring case.'
      parameters: [ { $ref: '#/components/parameters/WorkspaceId' } ]
      responses:
        '200':
          description: Tree
          content: { application/json: { schema: { $ref: '#/components/schemas/Tree' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/workspaces/{workspaceId}/items:
    post:
      summary: Create a folder or an empty file
      description: 'Operation: EditFiles (Owner, Editor). A new file has empty content at revision 1.'
      parameters: [ { $ref: '#/components/parameters/WorkspaceId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateItemRequest' } } }
      responses:
        '201':
          description: Created. Location is /api/workspaces/{workspaceId}/items/{id}.
          content: { application/json: { schema: { $ref: '#/components/schemas/Item' } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation_failed (missing kind/name) | malformed_request | invalid_name | unsupported_extension | too_deep | path_too_long' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem', description: 'not_found (workspace) | parent_not_found (parentId is not a folder in this workspace)' }
        '409': { $ref: '#/components/responses/Problem', description: 'name_taken | too_many_items' }

  /api/workspaces/{workspaceId}/items/{itemId}:
    delete:
      summary: Permanently delete a file, or a folder and its whole subtree
      description: 'Operation: DeleteFiles (Owner only). All or nothing.'
      parameters: [ { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/ItemId' } ]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ItemNotFound' }

  /api/workspaces/{workspaceId}/items/{itemId}/rename:
    post:
      summary: Rename a file or folder
      description: >
        Operation: EditFiles (Owner, Editor). Keeps id, content, revision and children.
        Changing only the letter case of the item's own name is allowed.
      parameters: [ { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/ItemId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RenameItemRequest' } } }
      responses:
        '200':
          description: Renamed
          content: { application/json: { schema: { $ref: '#/components/schemas/Item' } } }
        '400': { $ref: '#/components/responses/Problem', description: 'validation_failed | malformed_request | invalid_name | unsupported_extension | path_too_long' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ItemNotFound' }
        '409': { $ref: '#/components/responses/Problem', description: name_taken }

  /api/workspaces/{workspaceId}/items/{itemId}/move:
    post:
      summary: Move a file or folder (with its subtree) to another folder or the top level
      description: >
        Operation: EditFiles (Owner, Editor). Moving to the current parent succeeds with no change.
      parameters: [ { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/ItemId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MoveItemRequest' } } }
      responses:
        '200':
          description: Moved
          content: { application/json: { schema: { $ref: '#/components/schemas/Item' } } }
        '400': { $ref: '#/components/responses/Problem', description: 'malformed_request (parentId missing) | invalid_move (into itself or a descendant) | too_deep | path_too_long' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Problem', description: 'not_found (workspace) | item_not_found | parent_not_found' }
        '409': { $ref: '#/components/responses/Problem', description: name_taken }

  /api/workspaces/{workspaceId}/files/{itemId}/content:
    get:
      summary: Read a file's content exactly as stored
      description: 'Operation: Read (Owner, Editor, Viewer). A folder id returns item_not_found.'
      parameters: [ { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/ItemId' } ]
      responses:
        '200':
          description: Content, byte for byte as last saved.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content: { text/plain; charset=utf-8: { schema: { type: string } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/ItemNotFound' }
    put:
      summary: Save a file's content if it is still at the stated revision
      description: >
        Operation: EditFiles (Owner, Editor). The body is the complete new content as raw UTF-8
        text (no JSON). The save succeeds only if If-Match equals the current revision; the
        revision then increases by one. Rename and move do not change the revision.
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { $ref: '#/components/parameters/ItemId' }
        - name: If-Match
          in: header
          required: true
          description: The revision the edit is based on, as a quoted ETag, e.g. "7". Wildcard * is not accepted.
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      requestBody:
        required: true
        description: '0–1,048,576 bytes of strict UTF-8 without U+0000. Line endings and a leading BOM are kept as sent.'
        content: { text/plain; charset=utf-8: { schema: { type: string } } }
      responses:
        '200':
          description: Saved
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content: { application/json: { schema: { $ref: '#/components/schemas/SaveResult' } } }
        '400': { $ref: '#/components/responses/Problem', description: 'invalid_content (not UTF-8, or contains U+0000) | malformed_request (unparseable If-Match)' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ItemNotFound', description: 'item_not_found — includes a file deleted since it was opened' }
        '412':
          description: revision_conflict — the file changed since the stated revision; nothing was saved
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ConflictProblem' } } }
        '413': { $ref: '#/components/responses/Problem', description: content_too_large }
        '415': { $ref: '#/components/responses/Problem', description: unsupported_media_type — body must be text/plain; charset=utf-8 }
        '428': { $ref: '#/components/responses/Problem', description: revision_required — If-Match missing }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT, description: 'Access token from 002' }

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Malformed values return 404 not_found.
      schema: { type: string }
    ItemId:
      name: itemId
      in: path
      required: true
      description: Malformed values, ids of another workspace's items, and missing items all return 404 item_not_found.
      schema: { type: string }

  headers:
    ETag:
      description: The file's revision as a strong ETag, e.g. "7".
      schema: { type: string }

  schemas:
    ItemKind: { type: string, enum: [folder, file] }

    Item:
      type: object
      required: [id, parentId, kind, name, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: [string, 'null'], format: uuid, description: null = top level }
        kind: { $ref: '#/components/schemas/ItemKind' }
        name: { type: string, minLength: 1, maxLength: 255 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: Last create, rename or move (not content saves) }

    Tree:
      type: object
      required: [items, limits]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Item' }, maxItems: 5000 }
        limits:
          type: object
          description: Server limits, so the client validates with the same numbers.
          required: [maxNameLength, maxPathLength, maxDepth, maxItems, maxContentBytes]
          properties:
            maxNameLength: { type: integer, const: 255 }
            maxPathLength: { type: integer, const: 1024 }
            maxDepth: { type: integer, const: 20 }
            maxItems: { type: integer, const: 5000 }
            maxContentBytes: { type: integer, const: 1048576 }

    CreateItemRequest:
      type: object
      required: [parentId, kind, name]
      properties:
        parentId: { type: [string, 'null'], format: uuid, description: 'Required; null = top level' }
        kind: { $ref: '#/components/schemas/ItemKind' }
        name: { type: string, description: 'Not trimmed. File names need one of: .cs .js .ts .tsx .jsx .json .html .css .py .java .md (any case)' }

    RenameItemRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }

    MoveItemRequest:
      type: object
      required: [parentId]
      properties:
        parentId: { type: [string, 'null'], format: uuid, description: 'Required (an absent property is malformed_request); null = top level' }

    SaveResult:
      type: object
      required: [revision, sizeBytes, updatedAt]
      properties:
        revision: { type: integer, minimum: 2 }
        sizeBytes: { type: integer, minimum: 0, maximum: 1048576 }
        updatedAt: { type: string, format: date-time }

    Problem:
      type: object
      required: [title, status, code, correlationId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: All 002 codes, plus the 003 codes listed here.
          enum:
            - item_not_found          # 404
            - parent_not_found        # 404
            - invalid_name            # 400
            - unsupported_extension   # 400
            - too_deep                # 400
            - path_too_long           # 400
            - invalid_move            # 400
            - invalid_content         # 400
            - name_taken              # 409
            - too_many_items          # 409
            - revision_conflict       # 412
            - content_too_large       # 413
            - unsupported_media_type  # 415
            - revision_required       # 428
        correlationId: { type: string }

    ConflictProblem:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          required: [currentRevision]
          properties:
            currentRevision: { type: integer, minimum: 1 }

  responses:
    Problem:
      description: Problem Details
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthenticated:
      description: 'unauthenticated | token_expired | session_ended (002)'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: forbidden — member whose role lacks the operation (Viewer for EditFiles; Editor or Viewer for DeleteFiles)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: not_found — workspace missing, malformed id, or caller is not a member
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ItemNotFound:
      description: 'not_found (workspace, as above) | item_not_found (member, but no such item in this workspace, or wrong kind)'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
